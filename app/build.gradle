apply plugin: 'com.android.application'

// Upload-signing config is loaded from keystore.properties (gitignored). Absent on CI / fresh
// clones → release builds are left unsigned rather than failing.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

// AdMob IDs (not secret) come from gradle.properties. Debug always uses Google's public test IDs:
// live units on dev devices count as invalid traffic.
def admobTestAppId = 'ca-app-pub-3940256099942544~3347511713'
def admobTestBannerUnit = 'ca-app-pub-3940256099942544/9214589741'
def admobAppId = findProperty('admobAppId') ?: admobTestAppId
def admobBannerUnit = findProperty('admobBannerUnit') ?: admobTestBannerUnit
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name ==~ /(assemble|bundle)Release/ } && (admobAppId == admobTestAppId || admobBannerUnit == admobTestBannerUnit))
        throw new GradleException('Set admobAppId and admobBannerUnit in gradle.properties to the real AdMob IDs before a release build')
}

android {
    compileSdk 36
    defaultConfig {
        applicationId "com.spinykiller.smsforward"
        minSdkVersion 25
        targetSdkVersion 36
        versionCode 9
        versionName "1.1.0"
        manifestPlaceholders = [admobAppId: admobAppId]
        buildConfigField 'String', 'BANNER_UNIT', "\"$admobBannerUnit\""
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: admobTestAppId]
            buildConfigField 'String', 'BANNER_UNIT', "\"$admobTestBannerUnit\""
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release

            // Additional optimizations
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
        }
    }
    
    // BuildConfig carries the AdMob banner unit
    buildFeatures {
        buildConfig true
    }
    
    // Optimize APK
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/*.version'
        exclude 'META-INF/proguard/*'
        exclude 'META-INF/com.android.tools/**'
        exclude 'META-INF/androidx.**'
        exclude 'META-INF/com.google.**'
    }
    
    // android.util.Log in code under JVM unit tests
    testOptions {
        unitTests.returnDefaultValues = true
    }

    namespace 'com.enixcoda.smsforward'
}

dependencies {
    // Core Android libraries (minimal set)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    // Retries Telegram/Web forwards that fail while offline
    implementation 'androidx.work:work-runtime:2.9.1'

    // Monetization: banner ads, GDPR consent, Pro purchases (same versions as MemoryMedic)
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    implementation 'com.android.billingclient:billing:8.0.0'

    // Pro app lock (fingerprint/face or screen lock)
    implementation 'androidx.biometric:biometric:1.1.0'

    // Email forwarding over SMTP (e.g. Gmail with an app password)
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    // The ads SDK brings Guava at runtime, which empties the listenablefuture artifact WorkManager's Worker
    // compiles against; declare the same Guava so ListenableFuture is on the compile classpath (no size change)
    implementation 'com.google.guava:guava:31.1-android'
    
    // Material Design (only if needed for UI)
    implementation 'com.google.android.material:material:1.10.0'
    
    // Remove unnecessary dependencies:
    // - com.sun.mail:android-mail (not used)
    // - com.sun.mail:android-activation (not used) 
    // - com.fasterxml.jackson.core:jackson-annotations (not used)
    
    // Test dependencies (only for debug builds)
    testImplementation 'junit:junit:4.13.2'
    debugImplementation 'androidx.test.ext:junit:1.1.5'
    debugImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
